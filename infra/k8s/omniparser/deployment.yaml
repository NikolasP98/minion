apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniparser
  namespace: minion
  labels:
    app: omniparser
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omniparser
  template:
    metadata:
      labels:
        app: omniparser
        version: v2
    spec:
      # Prefer GPU nodes; tolerate GPU taint so we can land there.
      # Falls back to CPU nodes when no GPU node is schedulable.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu
                    operator: Exists
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: omniparser
          image: ghcr.io/nikolasp98/minion-omniparser:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MODELS_DIR
              value: /models
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
