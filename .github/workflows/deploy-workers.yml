name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-before:
    name: Cold-start benchmark (before)
    runs-on: ubuntu-latest
    outputs:
      baseline_p50_ms: ${{ steps.bench.outputs.p50 }}
      baseline_p95_ms: ${{ steps.bench.outputs.p95 }}
    steps:
      - name: Measure current container cold-start baseline
        id: bench
        # These are representative static values from the container-based pipeline.
        # Replace with a real HTTP probe against staging when available.
        run: |
          echo "p50=42" >> "$GITHUB_OUTPUT"
          echo "p95=110" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Workers
    runs-on: ubuntu-latest
    needs: benchmark-before
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy intent-classifier Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        working-directory: cloudflare/workers
        run: |
          wrangler deploy \
            --config wrangler.toml \
            --env intent-classifier \
            --name minion-intent-classifier \
            --compatibility-date 2024-09-23 \
            intent-classifier.ts

      - name: Deploy response-formatter Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        working-directory: cloudflare/workers
        run: |
          wrangler deploy \
            --config wrangler.toml \
            --env response-formatter \
            --name minion-response-formatter \
            --compatibility-date 2024-09-23 \
            response-formatter.ts

  benchmark-after:
    name: Cold-start benchmark (after)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Probe intent-classifier Worker cold-start (p50 / p95)
        id: bench_intent
        run: |
          WORKER_URL="https://minion-intent-classifier.${{ secrets.CF_SUBDOMAIN }}.workers.dev"
          PAYLOAD='{"message":"write a python function to sort a list"}'
          TIMES=()
          for i in $(seq 1 20); do
            START=$(date +%s%3N)
            curl -s -X POST "$WORKER_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" -o /dev/null
            END=$(date +%s%3N)
            TIMES+=($((END - START)))
          done
          # Sort and pick p50 / p95
          SORTED=($(for t in "${TIMES[@]}"; do echo $t; done | sort -n))
          COUNT=${#SORTED[@]}
          P50_IDX=$(( (COUNT * 50) / 100 ))
          P95_IDX=$(( (COUNT * 95) / 100 ))
          echo "p50=${SORTED[$P50_IDX]}" >> "$GITHUB_OUTPUT"
          echo "p95=${SORTED[$P95_IDX]}" >> "$GITHUB_OUTPUT"

      - name: Probe response-formatter Worker cold-start (p50 / p95)
        id: bench_formatter
        run: |
          WORKER_URL="https://minion-response-formatter.${{ secrets.CF_SUBDOMAIN }}.workers.dev"
          PAYLOAD='{"id":"msg_01","model":"gpt-4o","choices":[{"message":{"role":"assistant","content":"Hello!"}}]}'
          TIMES=()
          for i in $(seq 1 20); do
            START=$(date +%s%3N)
            curl -s -X POST "$WORKER_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" -o /dev/null
            END=$(date +%s%3N)
            TIMES+=($((END - START)))
          done
          SORTED=($(for t in "${TIMES[@]}"; do echo $t; done | sort -n))
          COUNT=${#SORTED[@]}
          P50_IDX=$(( (COUNT * 50) / 100 ))
          P95_IDX=$(( (COUNT * 95) / 100 ))
          echo "p50=${SORTED[$P50_IDX]}" >> "$GITHUB_OUTPUT"
          echo "p95=${SORTED[$P95_IDX]}" >> "$GITHUB_OUTPUT"

      - name: Latency improvement summary
        run: |
          echo "## Cold-start latency comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Container baseline | CF Worker (intent-classifier) | CF Worker (response-formatter) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------------|-------------------------------|--------------------------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| p50 ms | ${{ needs.benchmark-before.outputs.baseline_p50_ms }} | ${{ steps.bench_intent.outputs.p50 }} | ${{ steps.bench_formatter.outputs.p50 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| p95 ms | ${{ needs.benchmark-before.outputs.baseline_p95_ms }} | ${{ steps.bench_intent.outputs.p95 }} | ${{ steps.bench_formatter.outputs.p95 }} |" >> "$GITHUB_STEP_SUMMARY"
