# Minion Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "minion"
primary_region = "iad" # change to your closest region

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
# Fly uses x86, but keep this for consistency
MINION_PREFER_PNPM = "1"
MINION_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=1536"
# REDIS_URL is required for stateless horizontal scaling (multiple instances).
# Provision an Upstash Redis database and set this secret:
#   fly secrets set REDIS_URL=rediss://<token>@<host>:<port>
# Single-instance deployments can omit REDIS_URL entirely.

[processes]
app = "node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false # Keep running for persistent connections
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"

[mounts]
source = "minion_data"
destination = "/data"
