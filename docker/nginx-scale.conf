# nginx round-robin load balancer for multi-instance Minion gateway.
# No sticky sessions required — all state is externalized to Redis.
#
# Used by docker/docker-compose.scale.yml.

upstream minion_gateway_ws {
    # Round-robin (default); no ip_hash or sticky directives
    server minion_gateway:18789;
    server minion_gateway_2:18789;
    server minion_gateway_3:18789;
}

upstream minion_gateway_bridge {
    server minion_gateway:18790;
    server minion_gateway_2:18790;
    server minion_gateway_3:18790;
}

server {
    listen 18789;

    location / {
        proxy_pass http://minion_gateway_ws;
        proxy_http_version 1.1;
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 18790;

    location / {
        proxy_pass http://minion_gateway_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
